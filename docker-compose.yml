# =============================================================================
# OASIS Docker Compose — rol CLIENTE (nodo personal)
# =============================================================================
# Componentes:
#   - oasis-client: Red social descentralizada SSB (GUI :3000 + sbot :8008)
#   - ecoin-wallet: Wallet cryptocurrency P2P ECOin (opcional, profile "ecoin")
#
# ECOin en el cliente (WP-O103, docs/CLIENT-PROTOCOL.md): dos modos, elegidos en el .env raíz
# (plantilla: .env.example; lo genera «npm run client:ecoin:init»):
#   (i)  solo dirección — sin perfil: ecoin-wallet no existe y ECOIN_RPC_URL va vacía.
#   (ii) cartera propia — COMPOSE_PROFILES=ecoin y ECOIN_RPC_URL=http://ecoin-wallet:7474.
# El cliente NUNCA apunta al ecoind del VPS.
#
# El rol PUB vive en pub/docker-compose.pub.yml (misma imagen, modo server).
# =============================================================================

name: o-sdk

services:
  # ===========================================================================
  # OASIS - Red Social Descentralizada
  # ===========================================================================
  oasis-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oasis-client
    ports:
      - "8008:8008"   # Puerto SSB
      # GUI: atada a 127.0.0.1 del host y servida por el puente de loopback (3001 → 127.0.0.1:3000 dentro).
      # Oasis exige que Banking/Wallet/Settings lleguen desde el loopback; con "3000:3000" el backend ve la
      # IP del bridge y responde 403. NUNCA publicar este puerto en 0.0.0.0: daría esos poderes a la LAN.
      - "127.0.0.1:3000:3001"
    volumes:
      # Volumenes persistentes para datos críticos
      - oasis-ssb-data-dev:/home/oasis/.ssb
      - oasis-ai-models-dev:/app/src/AI/models
      - oasis-logs-dev:/app/logs
      # Estado persistente del cliente (WP-O103): oasis-config.json de la GUI y banking/
      - oasis-client-state-dev:/app/state

    environment:
      - NODE_ENV=production
      # 🔧 DEFINITIVO: Prohibir compilación completamente
      - NODE_LLAMA_CPP_SKIP_DOWNLOAD=false
      - NODE_LLAMA_CPP_USE_PREBUILT_BINARIES=true
      - NODE_LLAMA_CPP_BUILD_FROM_SOURCE=false
      - NODE_LLAMA_CPP_FORCE_BUILD=never
      - NODE_LLAMA_CPP_SKIP_LLAMA_CPP_CLONE=true
      # GPU Configuration 
      - GPU_ENABLED=true
      - GPU_LAYERS=35
      - VRAM_PADDING=256
      # NVIDIA GPU Configuration
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # ECOin (WP-O103): el entrypoint cablea estas variables en oasis-config.json («env manda»).
      # ECOIN_RPC_URL vacía (por defecto) = modo «solo dirección»: ningún RPC saliente.
      # Solo se admite un ecoind local (ecoin-wallet, localhost…); nunca el del VPS.
      - ECOIN_RPC_URL=${ECOIN_RPC_URL-}
      - ECOIN_RPC_USER=${ECOIN_RPC_USER-}
      - ECOIN_RPC_PASS=${ECOIN_RPC_PASS-}
      - ECOIN_RPC_ALLOW_REMOTE=${ECOIN_RPC_ALLOW_REMOTE-}
      - OASIS_WALLET_FEE=${OASIS_WALLET_FEE-}
      - OASIS_WALLET_WIRING=${OASIS_WALLET_WIRING-}
      # Sin OASIS_BANKING_DIR (Oasis 1.1.4): el estado bancario vive en ~/.ssb/oasis/banking, dentro del bind
      # de ssb-data. Con la variable habría dos mapas de direcciones (CLIENT-PROTOCOL §8.3).
      - OASIS_CLIENT_STATE_DIR=/app/state
      - OASIS_LOOPBACK_PROXY_PORT=3001
    
    # ✅ GPU habilitada con runtime nvidia y configuración dual
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - oasis-network
    # Con el perfil "ecoin" activo, ecoin-wallet arranca antes; sin perfil, se ignora (required: false).
    # service_started y no service_healthy: la sincronización inicial no debe bloquear la GUI.
    depends_on:
      ecoin-wallet:
        condition: service_started
        required: false

  # ===========================================================================
  # ECOIN WALLET - Cryptocurrency P2P
  # ===========================================================================
  ecoin-wallet:
    profiles: ["ecoin"]
    build:
      context: ./ecoin
      dockerfile: Dockerfile
    container_name: ecoin-wallet
    # SIN ports (WP-O103): el RPC (7474) solo existe en oasis-network (oasis-client llega por DNS de
    # servicio) y el P2P (7408) es solo saliente. Quien quiera P2P entrante puede añadirlo en un
    # docker-compose.override.yml local (no versionado):
    #   services:
    #     ecoin-wallet:
    #       ports: ["7408:7408"]
    # El RPC no se publica nunca en el host.
    volumes:
      - ecoin-data:/home/ecoin/.ecoin
    environment:
      # Credenciales desde el .env raíz (npm run client:ecoin:init). Vacías o «ecoinrpc» -> el
      # entrypoint de la imagen sale con 1 (fail-closed). Se usa «:-» y no «:?» porque Compose
      # interpola también los servicios de perfiles inactivos: «:?» rompería el arranque sin perfil.
      RPC_USER: ${ECOIN_RPC_USER:-}
      RPC_PASS: ${ECOIN_RPC_PASS:-}
      RPC_PORT: "7474"
      ECOIN_REQUIRE_CREDS: "1"
    restart: unless-stopped
    mem_limit: ${ECOIN_MEM_LIMIT:-512m}
    stop_grace_period: 2m   # cierre limpio de Berkeley DB (wallet.dat)
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:   # $$ = lo expande el shell del contenedor: las credenciales no quedan en el compose resuelto
      test: ["CMD-SHELL", "curl -sf -o /dev/null --user \"$$RPC_USER:$$RPC_PASS\" -H 'content-type: text/plain;' --data-binary '{\"jsonrpc\":\"1.0\",\"id\":\"health\",\"method\":\"getinfo\",\"params\":[]}' http://127.0.0.1:7474/ || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 180s  # Blockchain sync puede tardar
    networks:
      - oasis-network

# Volumenes persistentes nombrados
volumes:
  oasis-ssb-data-dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes-dev/ssb-data
  
  oasis-ai-models-dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes-dev/ai-models
  
  oasis-logs-dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes-dev/logs

  oasis-client-state-dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes-dev/client-state

  # ECOin wallet data (wallet.dat, cadena). Volumen NOMBRADO y EXTERNO (WP-O103): BDB sobre un bind de
  # Windows es frágil, y «down -v» no borra volúmenes externos. Lo crea «npm run client:ecoin:init»
  # (docker volume create o-sdk-client-ecoin-data). Solo se exige con el perfil "ecoin" activo.
  ecoin-data:
    external: true
    name: o-sdk-client-ecoin-data


# Red compartida Oasis <-> ECOin
networks:
  oasis-network:
    driver: bridge
