# Delta de publicación esperado al recrear cada nodo con la imagen nueva (UPGRADE-PROTOCOL §3.4, gate U3).
# Lo lee `upgrade-gates.sh check` cuando no se pasa --expect. Una línea por nodo: nodo:tipo=+N[,tipo=+a..b].
# Lo que no se nombra debe ser 0. Vigente desde Oasis 1.2.6 (karmaScore) y 1.2.3 (about de clearnetSince).
# pubAvailability solo se mueve con el motor de RBU encendido; ubiAllocation y (cifrado) deben ser 0.
pub:oasisVersion=+1
hub:oasisVersion=+1,karmaScore=+0..1
bot:oasisVersion=+1,karmaScore=+0..1,about=+0..1,pubAvailability=+0..1
