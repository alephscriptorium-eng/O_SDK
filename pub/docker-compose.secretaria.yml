# =============================================================================
# docker-compose.secretaria.yml — la SECRETARÍA sola (bot retro en modo server) en una máquina que no corre el pub.
# Override de docker-compose.pub.yml: mismo código y misma imagen, pero solo un servicio, otro proyecto, otro
# contenedor y datos en volumes-real/secretaria-<id>/ (identidad REAL: ningún drill lo copia ni lo repone).
# Es la variante B de docs/PUB/TEMPLATE-RUNBOOK.md: la secretaría se une al pub del colectivo por invite y
# conn.remember. La variante A (junto al pub, en su mismo compose) no usa este fichero: `--profile retro`.
#
# Uso (SIEMPRE desde la raíz del repo, SIEMPRE por el mando):
#   bash pub/scripts/secretaria.sh <id> prep|caps|config|up|status|join|about|seed|check|codigos|backup|down
#   D="docker compose -p oasis-secretaria-<id> --env-file pub/.env.secretaria-<id> -f pub/docker-compose.pub.yml -f pub/docker-compose.secretaria.yml"
#
# Requisitos del env (los escribe `prep`): SECRETARIA_ID, OASIS_RETRO_BOT_* (datos, logs, ssb-config con el caps.shs del
# pub del colectivo, plantilla y kit), SECRETARIA_PUB_ID y SECRETARIA_PUB_ADDR (los rellena `join` desde el invite).
# =============================================================================

name: oasis-secretaria-${SECRETARIA_ID:-x}

services:
  oasis-retro-bot:
    profiles: !override []            # sin perfil: es el único servicio de este proyecto
    container_name: secretaria-${SECRETARIA_ID:-x}-bot
    depends_on: !reset []             # aquí no hay pub: el bot se une al del colectivo por la red
    restart: unless-stopped

  # Todo lo demás del compose base queda fuera (perfil «nunca»): `up` solo levanta el bot.
  oasis-pub:
    profiles: ["nunca"]
  pub-panel-api:
    profiles: ["nunca"]
  pub-web:
    profiles: ["nunca"]
    depends_on: !reset []
  oasis-hub:
    profiles: ["nunca"]
  hub-cache:
    profiles: ["nunca"]
  ecoin:
    profiles: ["nunca"]
  oasis-wallet-bot:
    profiles: ["nunca"]
  pub-frontend:
    profiles: ["nunca"]
