name: oasis-pub-scriptorium

services:
  oasis-pub:
    build:
      context: ..
      dockerfile: Dockerfile
    image: oasis-pub-scriptorium:latest
    container_name: oasis-pub-scriptorium
    command: ["server"]
    restart: unless-stopped
    # Capacidad (docs/PUB/CAPACIDAD.md): el pub no tenía techo de memoria ni rotación de su log.
    # Dentro de este contenedor corre además, cada 6 h, la construcción del snapshot (ver abajo).
    mem_limit: ${OASIS_PUB_MEM_LIMIT:-1024m}
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    environment:
      NODE_ENV: production
      OASIS_SKIP_AI_MODEL: "true"
      OASIS_SERVER_CONFIG_OVERRIDE: /home/oasis/.ssb/config
      OASIS_PUB_INTERNAL_SSB_PORT: ${OASIS_PUB_INTERNAL_SSB_PORT:-8008}
      # Snapshot para clientes nuevos (Oasis >= 1.2, HUB-PROTOCOL §13): el propio pub lo reconstruye
      # cada N horas, sin nada instalado en el host. 0 = no ofrecerlo. Techo del fichero en MB.
      OASIS_PUB_SNAPSHOT_HOURS: ${OASIS_PUB_SNAPSHOT_HOURS:-6}
      SNAPSHOT_MAX_MB: ${OASIS_PUB_SNAPSHOT_MAX_MB:-1024}
      HOME: /home/oasis
      SSB_PATH: /home/oasis/.ssb
    ports:
      - "${OASIS_PUB_SSB_PORT:-8008}:${OASIS_PUB_INTERNAL_SSB_PORT:-8008}"
    volumes:
      - "${OASIS_PUB_SSB_DATA_DIR:-../volumes-dev/oasis-pub/ssb-data}:/home/oasis/.ssb"
      - "${OASIS_PUB_LOGS_DIR:-../volumes-dev/oasis-pub/logs}:/app/logs"
      - "${OASIS_PUB_SSB_CONFIG_FILE:-./config/ssb/config}:/home/oasis/.ssb/config:ro"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const net=require('net');const sock='/home/oasis/.ssb/socket';const s=net.connect(sock,()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - oasis_pub_net

  pub-panel-api:
    build:
      context: ./panel-api
      dockerfile: Dockerfile
    image: oasis-pub-panel-api:latest
    container_name: oasis-pub-panel-api
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      NODE_ENV: production
      PUB_PANEL_TOKEN: ${PUB_PANEL_TOKEN:?Set PUB_PANEL_TOKEN in pub/.env}
      OASIS_PUB_CONTAINER: oasis-pub-scriptorium
      OASIS_PUB_HOST: ${OASIS_PUB_HOST:-pub.escrivivir.co}
      OASIS_PUB_PORT: ${OASIS_PUB_SSB_PORT:-8008}
      PANEL_BIND_HOST: 0.0.0.0
      PANEL_PORT: 8787
    ports:
      - "127.0.0.1:${PUB_PANEL_PORT:-8787}:8787"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - oasis-pub
    networks:
      - oasis_pub_net

  pub-web:
    image: caddy:2-alpine
    container_name: oasis-pub-web
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      OASIS_PUB_WEB_HOST: ${OASIS_PUB_WEB_HOST:-pub.escrivivir.co}
    ports:
      - "${OASIS_PUB_HTTP_PORT:-80}:80"
      - "${OASIS_PUB_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      # Teatro: contenido pesado (obras) servido desde el volumen de datos,
      # montado sobre el mountpoint vacío pub/site/teatro/ del repo.
      - "${OASIS_PUB_TEATRO_DIR:-../volumes-dev/teatro}:/srv/site/teatro:ro"
      - "${OASIS_PUB_CADDY_DATA_DIR:-../volumes-dev/oasis-pub/caddy-data}:/data"
      - "${OASIS_PUB_CADDY_CONFIG_DIR:-../volumes-dev/oasis-pub/caddy-config}:/config"
    depends_on:
      - pub-panel-api
    networks:
      - oasis_pub_net

  oasis-hub:                      # nodo de soporte: backend.js --public con sbot embebido (gui.js:12-16)
    image: oasis-pub-scriptorium:latest      # misma imagen que el pub, sin build
    container_name: oasis-pub-hub
    command: ["backend"]                     # docker-entrypoint.sh:521-524 -> node backend.js --host 0.0.0.0
    restart: unless-stopped
    depends_on: [oasis-pub]
    environment:
      NODE_ENV: production
      OASIS_SKIP_AI_MODEL: "true"
      OASIS_SERVER_CONFIG_OVERRIDE: /home/oasis/.ssb/config
      HOME: /home/oasis
      SSB_PATH: /home/oasis/.ssb
      OASIS_PUBLIC: ${OASIS_HUB_PUBLIC:-true}     # false SOLO durante el bootstrap del invite
      OASIS_SNAPSHOT: "off"                       # D-O27: el snapshot lo construye el pub; aquí nadie lo pide
      OASIS_OPEN: "false"
      OASIS_ALLOW_HOST: ${OASIS_HUB_ALLOW_HOST:-pub.escrivivir.co}
      NODE_OPTIONS: ${OASIS_HUB_NODE_OPTIONS:---max-old-space-size=1024}
    volumes:
      - "${OASIS_HUB_SSB_DATA_DIR:-../volumes-dev/oasis-hub/ssb-data}:/home/oasis/.ssb"
      - "${OASIS_HUB_LOGS_DIR:-../volumes-dev/oasis-hub/logs}:/app/logs"
      - "${OASIS_HUB_SSB_CONFIG_FILE:-./config/hub/ssb-config}:/home/oasis/.ssb/config:ro"
      # Desde Oasis 1.2.4 config-manager.js lee ~/.ssb/oasis/oasis-config.json (el de src/configs solo se copia
      # una vez si aquel falta): el bind va al sitio nuevo o la regeneración de HUB-PROTOCOL §5.2 deja de surtir efecto.
      - "${OASIS_HUB_OASIS_CONFIG_FILE:-./config/hub/oasis-config.json}:/home/oasis/.ssb/oasis/oasis-config.json:ro"
    # sin ports: 3000 y 8008 solo en oasis_pub_net
    mem_limit: ${OASIS_HUB_MEM_LIMIT:-1536m}      # generoso el día 1; 1.5×pico tras 24 h (dosier 07 §G6)
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    healthcheck:   # feed inexistente pero válido: una consulta backlinks, 200; NO /c (O(N·k), F11)
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000/c/inhabitant/@AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=.ed25519"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks: [oasis_pub_net]

  hub-cache:                      # caché HTTP en disco delante del HUB
    image: nginx:alpine
    container_name: oasis-pub-hub-cache
    restart: unless-stopped
    depends_on: [oasis-hub]
    environment:
      HUB_UPSTREAM: oasis-hub:3000
      HUB_CACHE_MAX_SIZE: ${HUB_CACHE_MAX_SIZE:-2g}
    volumes:
      - ./config/hub/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - "${OASIS_HUB_HTTP_CACHE_DIR:-../volumes-dev/oasis-hub/http-cache}:/var/cache/hub"
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/hub-cache-health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [oasis_pub_net]

  ecoin:                          # hub-wallet (WP-O102, docs/PUB/ECOIN-PROTOCOL.md): ecoind del pub
    profiles: ["wallet"]                     # pub:local:up / deploy.sh no lo arrastran ni exigen el .deb
    build:
      context: ../ecoin                      # exige ecoin/ecoin_0.0.4-1_amd64.deb (npm run pub:ecoin:fetch-deb); sha256 verificado en el build
      dockerfile: Dockerfile
    image: oasis-pub-ecoin:0.0.4-1
    container_name: oasis-pub-ecoin
    command: ["ecoind", "-printtoconsole", "-logtimestamps", "-maxconnections=${OASIS_ECOIN_MAXCONNECTIONS:-16}"]
    restart: unless-stopped
    environment:
      RPC_USER: ${OASIS_ECOIN_RPC_USER:-}    # hex (openssl rand -hex 32); vacío -> el entrypoint sale con 1
      RPC_PASS: ${OASIS_ECOIN_RPC_PASS:-}
      ECOIN_REQUIRE_CREDS: "1"               # fail-closed: sin credenciales o con «ecoinrpc» no arranca
    volumes:
      - "${OASIS_ECOIN_DATA_DIR:-../volumes-dev/ecoin}:/home/ecoin/.ecoin"   # cadena + wallet.dat (uid 1000, 700)
    # sin ports y sin depends_on: el RPC (7474) nunca sale de oasis_pub_net y el P2P (7408) es
    # solo saliente en fase 1; no depende de ningún otro servicio ni nadie arranca por él.
    mem_limit: ${OASIS_ECOIN_MEM_LIMIT:-512m}
    cpus: ${OASIS_ECOIN_CPUS:-0.75}
    stop_grace_period: 60s                   # cierre limpio de Berkeley DB (wallet.dat)
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:   # getinfo por RPC con las credenciales del contenedor ($$ = las expande el shell del contenedor)
      test: ["CMD-SHELL", "curl -sf -o /dev/null --user \"$$RPC_USER:$$RPC_PASS\" -H 'content-type: text/plain;' --data-binary '{\"jsonrpc\":\"1.0\",\"id\":\"health\",\"method\":\"getinfo\",\"params\":[]}' http://127.0.0.1:7474/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 600s                     # carga de bootstrap/índice en el primer arranque
    networks: [oasis_pub_net]

  oasis-wallet-bot:               # azofaifo-scriptorium-wallet-bot-2: backend con sbot embebido, cartera del pub (patrón oasis-hub)
    profiles: ["wallet"]
    image: oasis-pub-scriptorium:latest      # misma imagen que el pub, sin build
    container_name: oasis-pub-wallet-bot
    command: ["backend"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      OASIS_SKIP_AI_MODEL: "true"
      OASIS_SERVER_CONFIG_OVERRIDE: /home/oasis/.ssb/config
      HOME: /home/oasis
      SSB_PATH: /home/oasis/.ssb
      OASIS_PUBLIC: ${OASIS_WALLET_BOT_PUBLIC:-true}   # false SOLO durante el bootstrap del invite
      OASIS_SNAPSHOT: "off"                            # D-O27: ni lo construye ni arranca desde el del pub
      OASIS_OPEN: "false"
      OASIS_ALLOW_HOST: localhost
      # Sin OASIS_BANKING_DIR (retirado en 1.1.4): el estado bancario vive en ~/.ssb/oasis/banking, dentro
      # del bind de ssb-data. backend.js ignora esa variable y banking_model.js no: con ella habría dos
      # mapas de direcciones y riesgo de publicar una segunda dirección (ECOIN-PROTOCOL.md §5.4).
      NODE_OPTIONS: ${OASIS_WALLET_BOT_NODE_OPTIONS:---max-old-space-size=512}
    volumes:
      - "${OASIS_WALLET_BOT_SSB_DATA_DIR:-../volumes-dev/oasis-wallet-bot/ssb-data}:/home/oasis/.ssb"
      - "${OASIS_WALLET_BOT_LOGS_DIR:-../volumes-dev/oasis-wallet-bot/logs}:/app/logs"
      - "${OASIS_WALLET_BOT_SSB_CONFIG_FILE:-./config/wallet-bot/ssb-config}:/home/oasis/.ssb/config:ro"
      # Desde Oasis 1.2.4 la config del nodo se lee en ~/.ssb/oasis/oasis-config.json (ver oasis-hub).
      - "${OASIS_WALLET_BOT_OASIS_CONFIG_FILE:-../volumes-dev/oasis-wallet-bot/config/oasis-config.json}:/home/oasis/.ssb/oasis/oasis-config.json:ro"
    # sin ports y sin ruta en Caddy: 3000 y 8008 solo en oasis_pub_net. Motor de RBU (Oasis 1.1.4):
    # corre solo si el ssb-config montado dice pub:true. Interruptor = OASIS_WALLET_BOT_SSB_CONFIG_FILE
    # (ssb-config | ssb-config.engine-on); gestión: devops/scripts/hub-wallet.sh (ECOIN-PROTOCOL §9).
    mem_limit: ${OASIS_WALLET_BOT_MEM_LIMIT:-768m}
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    healthcheck:   # feed inexistente pero válido: una consulta backlinks, 200; NO /c (O(N·k), F11)
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000/c/inhabitant/@AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=.ed25519"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks: [oasis_pub_net]

  oasis-retro-bot:                # retro.escrivivir.co (bot nº 3): secretaría de plantillas (WP-O131, docs/PUB/TEMPLATE-PROTOCOL.md §4.3)
    profiles: ["retro"]                      # pub:local:up / deploy.sh no lo arrastran
    image: oasis-pub-scriptorium:latest      # misma imagen que el pub, sin build
    container_name: oasis-pub-retro-bot
    command: ["server"]                      # SOLO sbot (docker-entrypoint.sh:854-857): sin HTTP, sin avisos automáticos, sin snapshot.
                                             # Publica únicamente lo que el seeder le pide por su socket (pub/tools/lib/seed-hot.js).
                                             # No va en modo backend: un backend tendría su propio keyring de tribus en memoria y pisaría
                                             # el que escribe el seeder (src/models/crypto.js:549).
    restart: unless-stopped
    depends_on: [oasis-pub]
    environment:
      NODE_ENV: production
      OASIS_SKIP_AI_MODEL: "true"
      OASIS_SERVER_CONFIG_OVERRIDE: /home/oasis/.ssb/config
      OASIS_PUB_SNAPSHOT_HOURS: "0"          # D-O27: el snapshot lo construye el pub
      HOME: /home/oasis
      SSB_PATH: /home/oasis/.ssb
      NODE_OPTIONS: ${OASIS_RETRO_BOT_NODE_OPTIONS:---max-old-space-size=512}
    volumes:
      - "${OASIS_RETRO_BOT_SSB_DATA_DIR:-../volumes-dev/oasis-retro-bot/ssb-data}:/home/oasis/.ssb"
      - "${OASIS_RETRO_BOT_LOGS_DIR:-../volumes-dev/oasis-retro-bot/logs}:/app/logs"
      - "${OASIS_RETRO_BOT_SSB_CONFIG_FILE:-./config/retro-bot/ssb-config}:/home/oasis/.ssb/config:ro"
      # Seeder, sondas y plantillas vivas sin reconstruir la imagen. Las imágenes del kit no viajan en la
      # imagen Docker (.dockerignore excluye *.png): entran por este bind.
      - ./tools:/app/pub/tools:ro
      - ./templates:/app/pub/templates:ro
      # Hermano de templates, no anidado: un bind dentro de otro bind :ro no se puede crear si la imagen no trae
      # /app/pub (medido en el VPS, WP-O131 fase 3: «read-only file system» al crear el punto de montaje).
      - "${OASIS_RETRO_BOT_ASSETS_DIR:-./templates/assets/campamento}:/app/pub/assets/campamento:ro"
    # sin ports y sin ruta en Caddy: 8008 solo en oasis_pub_net. Sin oasis-config.json: en modo server apenas se lee.
    mem_limit: ${OASIS_RETRO_BOT_MEM_LIMIT:-512m}
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    healthcheck:   # el del pub: el socket unix del sbot responde
      test: ["CMD-SHELL", "node -e \"const net=require('net');const s=net.connect('/home/oasis/.ssb/socket',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [oasis_pub_net]

  pub-frontend:
    profiles: ["frontend"]
    build:
      context: ${PUB_FRONTEND_DIR:-./frontend}
      dockerfile: ${PUB_FRONTEND_DOCKERFILE:-Dockerfile}
    image: oasis-pub-angular-frontend:latest
    container_name: oasis-pub-angular-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      OASIS_PUB_HOST: ${OASIS_PUB_HOST:-pub.escrivivir.co}
      PUB_PANEL_API_URL: http://pub-panel-api:8787
    ports:
      - "127.0.0.1:${PUB_FRONTEND_PORT:-8080}:8080"
    depends_on:
      - pub-panel-api
    networks:
      - oasis_pub_net

networks:
  oasis_pub_net:
    driver: bridge

volumes:
  # Caché HTTP del HUB como volumen nombrado (Docker Desktop/Windows: los bind mounts
  # rompen proxy_cache de nginx -> "fstat() failed (2)" y todo sale MISS). En VPS se usa
  # la ruta bind de OASIS_HUB_HTTP_CACHE_DIR (ext4); en local: OASIS_HUB_HTTP_CACHE_DIR=hub_http_cache.
  hub_http_cache: {}
