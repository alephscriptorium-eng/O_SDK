# =============================================================================
# ECOin Configuration for Docker
# =============================================================================
# Este archivo se copia a /home/ecoin/.ecoin/ecoin.conf y a
# /usr/share/ecoin/ecoin.conf.default (semilla del entrypoint si falta la conf
# en el datadir, p. ej. con un bind mount vacío).
# Documentación: https://ecoin.03c8.net
# =============================================================================

# -----------------------------------------------------------------------------
# RPC Configuration - Para comunicación con Oasis
# -----------------------------------------------------------------------------
# SIN credenciales reales en git: los valores de abajo son MARCADORES. El
# entrypoint los sustituye por las variables de entorno RPC_USER / RPC_PASS
# (solo hex: `openssl rand -hex 32`). Con ECOIN_REQUIRE_CREDS=1 el contenedor
# no arranca si faltan o si valen el antiguo valor por defecto.
rpcuser=CHANGE_ME_VIA_RPC_USER
rpcpassword=CHANGE_ME_VIA_RPC_PASS
rpcport=7474

# Permitir conexiones RPC desde la red Docker (rangos privados 172.16-31.x.x y 192.168.x.x).
# OJO: este ecoind (base 0.7) NO entiende CIDR en rpcallowip: compara la IP del cliente
# como texto con comodines (*, ?). Con «172.16.0.0/12» respondia 403 a toda la red Docker
# (gate G2 de WP-O102). Una linea por /16 del rango privado 172.16.0.0/12.
rpcallowip=127.0.0.1
rpcallowip=172.16.*
rpcallowip=172.17.*
rpcallowip=172.18.*
rpcallowip=172.19.*
rpcallowip=172.20.*
rpcallowip=172.21.*
rpcallowip=172.22.*
rpcallowip=172.23.*
rpcallowip=172.24.*
rpcallowip=172.25.*
rpcallowip=172.26.*
rpcallowip=172.27.*
rpcallowip=172.28.*
rpcallowip=172.29.*
rpcallowip=172.30.*
rpcallowip=172.31.*
rpcallowip=192.168.*

# -----------------------------------------------------------------------------
# Server Configuration
# -----------------------------------------------------------------------------
# Ejecutar como servidor (acepta comandos RPC)
server=1

# NO ejecutar como daemon (Docker necesita foreground)
daemon=0

# Escuchar conexiones entrantes
listen=1

# Puerto P2P explícito: es el que enlaza este binario en mainnet (no 12000).
port=7408

# Deshabilitar IRC (obsoleto)
noirc=1

# Testnet desactivado (mainnet)
testnet=0

# -----------------------------------------------------------------------------
# Network Peers - Nodos conocidos de la red ECOin
# -----------------------------------------------------------------------------
# Servidores oficiales y comunitarios
addnode=46.163.118.220
addnode=82.223.99.61
addnode=5.253.247.48
addnode=primoroso.laenre.net
addnode=alzamoreno.myasustor.com
addnode=ecoin.hacksito.com
addnode=ecoin0.vps.webdock.cloud
addnode=ecoin1.vps.webdock.cloud
addnode=ecoin3.vps.webdock.cloud
addnode=ecoin4.vps.webdock.cloud
addnode=83.228.195.187
addnode=83.228.195.84
addnode=83.228.195.200

# DNS Seeder
dnsseed=ecoinseed.03c8.net

# -----------------------------------------------------------------------------
# Mining Configuration (opcional)
# -----------------------------------------------------------------------------
# Habilitar generación de bloques (PoS cuando hay balance)
# gen=1

# Número de threads para PoW mining (0 = auto)
# genproclimit=1

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
# Imprimir timestamps en logs
logtimestamps=1

# Debug nivel (0=minimal, 1=normal, 2=verbose)
# debug=1

# -----------------------------------------------------------------------------
# Performance
# -----------------------------------------------------------------------------
# Máximo de conexiones
maxconnections=125

# Timeout de conexión (segundos)
timeout=5000
